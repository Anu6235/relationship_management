<div *ngIf="isOpen" class="modal-wrapper">
  <!-- Modal overlay -->
  <div class="modal-overlay"></div>

  <!-- Modal content -->
  <div class="modal-container">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="text-xl font-semibold">Edit Ledger Type</h3>
        <button type="button" class="close-button" (click)="onCancel()">
          ×
        </button>
      </div>

      <div class="modal-body">
        <form [formGroup]="ledgerTypeForm" (ngSubmit)="onSubmit()">
          <div class="form-group">
            <label for="name">Name *</label>
            <input id="name" type="text" formControlName="name" />
            <div
              class="error"
              *ngIf="
                ledgerTypeForm.get('name')?.invalid &&
                ledgerTypeForm.get('name')?.touched
              "
            >
              Name is required
            </div>
          </div>

          <div class="form-group">
            <label for="description">Description *</label>
            <input id="description" type="text" formControlName="description" />
            <div
              class="error"
              *ngIf="
                ledgerTypeForm.get('description')?.invalid &&
                ledgerTypeForm.get('description')?.touched
              "
            >
              Description is required
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="form-group">
              <label for="amount">Amount *</label>
              <input
                id="amount"
                type="number"
                formControlName="amount"
                min="0"
                step="0.01"
              />
              <div
                class="error"
                *ngIf="
                  ledgerTypeForm.get('amount')?.invalid &&
                  ledgerTypeForm.get('amount')?.touched
                "
              >
                Amount must be 0 or greater
              </div>
            </div>

            <div class="form-group">
              <label for="duration_value">Duration *</label>
              <div class="flex gap-2">
                <input
                  id="duration_value"
                  type="number"
                  formControlName="duration_value"
                  min="1"
                  class="flex-grow"
                />
                <select
                  id="duration_unit"
                  formControlName="duration_unit"
                  class="w-1/3"
                >
                  <option *ngFor="let unit of durationUnits" [value]="unit">
                    {{ unit }}
                  </option>
                </select>
              </div>
              <div
                class="error"
                *ngIf="
                  ledgerTypeForm.get('duration_value')?.invalid &&
                  ledgerTypeForm.get('duration_value')?.touched
                "
              >
                Duration must be at least 1
              </div>
            </div>
          </div>

          <!-- Fine section -->
          <div class="mt-4 mb-4">
            <h4 class="font-semibold">Fine Settings</h4>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="form-group">
                <label for="fine_amount">Fine Amount *</label>
                <input
                  id="fine_amount"
                  type="number"
                  formControlName="fine_amount"
                  min="0"
                  step="0.01"
                />
                <div
                  class="error"
                  *ngIf="
                    ledgerTypeForm.get('fine_amount')?.invalid &&
                    ledgerTypeForm.get('fine_amount')?.touched
                  "
                >
                  Fine amount must be 0 or greater
                </div>
              </div>

              <div class="form-group">
                <label for="fine_interval_value">Fine Interval *</label>
                <div class="flex gap-2">
                  <input
                    id="fine_interval_value"
                    type="number"
                    formControlName="fine_interval_value"
                    min="1"
                    class="flex-grow"
                  />
                  <select
                    id="fine_interval_unit"
                    formControlName="fine_interval_unit"
                    class="w-1/3"
                  >
                    <option *ngFor="let unit of durationUnits" [value]="unit">
                      {{ unit }}
                    </option>
                  </select>
                </div>
                <div
                  class="error"
                  *ngIf="
                    ledgerTypeForm.get('fine_interval_value')?.invalid &&
                    ledgerTypeForm.get('fine_interval_value')?.touched
                  "
                >
                  Fine interval must be at least 1
                </div>
              </div>
            </div>
          </div>

          <div class="form-group mt-4">
            <div class="flex justify-between items-center mb-2">
              <label class="font-semibold">Conditions</label>
              <button
                type="button"
                class="btn-secondary-sm"
                (click)="addCondition()"
              >
                Add Condition
              </button>
            </div>

            <div formArrayName="conditions">
              <div
                *ngFor="let condition of conditions.controls; let i = index"
                [formGroupName]="i"
                class="bg-gray-50 p-3 mb-2 rounded-lg"
              >
                <div class="flex justify-between items-center">
                  <h4 class="font-medium">Condition {{ i + 1 }}</h4>
                  <button
                    type="button"
                    class="text-red-500"
                    (click)="removeCondition(i)"
                    *ngIf="conditions.length > 1"
                  >
                    Remove
                  </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-2">
                  <div class="form-group">
                    <label [for]="'field' + i">Field *</label>
                    <select [id]="'field' + i" formControlName="field">
                      <option
                        *ngFor="let field of memberFields"
                        [value]="field.value"
                      >
                        {{ field.label }}
                      </option>
                    </select>
                  </div>

                  <div class="form-group">
                    <label [for]="'value' + i">Value *</label>
                    <select [id]="'value' + i" formControlName="value">
                      <option
                        *ngFor="
                          let option of getFieldOptions(
                            condition.get('field')?.value
                          )
                        "
                        [value]="option"
                      >
                        {{ option }}
                      </option>
                    </select>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="form-group mt-4">
            <div class="flex items-center">
              <input
                id="is_active"
                type="checkbox"
                formControlName="is_active"
                class="mr-2"
              />
              <label for="is_active">Active</label>
            </div>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn-secondary" (click)="onCancel()">
              Cancel
            </button>
            <button
              type="submit"
              class="btn-primary"
              [disabled]="!ledgerTypeForm.valid || isSubmitting"
            >
              {{ isSubmitting ? "Updating..." : "Update" }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
