<div
  *ngIf="isVisible"
  class="fixed inset-0 z-30 flex items-center justify-center"
>
  <!-- Modal backdrop -->
  <div class="fixed inset-0 bg-black opacity-50" (click)="onCancel()"></div>

  <!-- Modal content -->
  <div class="relative bg-white rounded-lg shadow-lg dark:bg-gray-800 w-96">
    <!-- Modal header -->
    <div
      class="modal-header flex justify-between items-center px-6 py-4 border-b border-gray-200 dark:border-gray-700"
    >
      <h3 class="text-lg font-semibold text-gray-900 dark:text-gray-100">
        Confirm Verification
      </h3>
      <button
        class="close-button text-gray-500 hover:text-gray-700 dark:hover:text-gray-300"
        (click)="onCancel()"
      >
        &times;
      </button>
    </div>

    <!-- Modal body -->
    <div class="modal-body px-6 py-4">
      <p class="text-gray-600 dark:text-gray-400">
        Are you sure you want to proceed with verification? This action cannot
        be undone.
      </p>
    </div>

    <!-- Modal footer -->
    <div
      class="modal-footer flex justify-end space-x-4 px-6 py-4 border-t border-gray-200 dark:border-gray-700"
    >
      <button
        class="btn-secondary px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 bg-transparent border border-gray-300 rounded-lg hover:border-gray-500 focus:outline-none focus:shadow-outline-gray"
        (click)="onCancel()"
      >
        Cancel
      </button>
      <button
        class="btn-primary px-4 py-2 text-sm font-medium text-white bg-blue-600 border border-transparent rounded-lg hover:bg-blue-700 focus:outline-none focus:shadow-outline-blue"
        (click)="onConfirm()"
      >
        Verify
      </button>
    </div>
  </div>
</div>
